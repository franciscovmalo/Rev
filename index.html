<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMOZ - Social</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-theme="dark">

    <!-- HEADER -->
    <header class="top-header hidden" id="global-header">
        <div class="header-center-content">
            <span class="logo">DMOZ</span>
            <button class="settings-btn" id="settings-btn" title="Configurações">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </header>

    <!-- NAVBAR INFERIOR -->
    <nav class="navbar hidden" id="main-nav">
        <a href="#/feed" class="nav-link" id="nav-feed" title="Feed">
            <i class="fas fa-home"></i>
        </a>
        <a href="#/search" class="nav-link" id="nav-search" title="Buscar">
            <i class="fas fa-search"></i>
        </a>
        <a href="#/create" class="nav-link" id="nav-create" title="Novo Post">
            <i class="fas fa-plus-square"></i>
        </a>
        <a href="#/profile" class="nav-link" id="nav-profile" title="Perfil">
            <i class="fas fa-user"></i>
        </a>
    </nav>

    <!-- VIEW: LOGIN -->
    <div class="page-view" id="login-view">
        <div class="auth-card">
            <h1>DMOZ</h1>
            <form id="form-login" class="auth-form">
                <div class="form-group">
                    <input 
                        name="email" 
                        type="email" 
                        placeholder="Email" 
                        required
                        autocomplete="email"
                    >
                </div>
                <div class="form-group">
                    <input 
                        name="password" 
                        type="password" 
                        placeholder="Senha" 
                        required
                        autocomplete="current-password"
                    >
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
                <div class="form-error" id="login-error"></div>
            </form>
            <p class="auth-link">Novo por aqui? <a href="#" id="to-register">Criar Conta</a></p>
        </div>
    </div>

    <!-- VIEW: REGISTRO -->
    <div class="page-view hidden" id="register-view">
        <div class="auth-card">
            <h1>Criar Conta</h1>
            <form id="form-register" class="auth-form">
                <div class="form-group">
                    <input 
                        id="reg-email" 
                        type="email" 
                        placeholder="Email" 
                        required
                        autocomplete="email"
                    >
                </div>
                <div class="form-group">
                    <input 
                        id="reg-username" 
                        type="text" 
                        placeholder="Username" 
                        required
                        pattern="^[a-zA-Z0-9_-]{3,20}$"
                        title="3-20 caracteres, apenas letras, números, _ e -"
                    >
                </div>
                <div class="form-group">
                    <input 
                        id="reg-password" 
                        type="password" 
                        placeholder="Senha" 
                        required
                        minlength="6"
                    >
                </div>
                <button type="submit" class="btn-primary">Registar</button>
                <div class="form-error" id="register-error"></div>
            </form>
            <p class="auth-link"><a href="#" id="to-login">Voltar ao Login</a></p>
        </div>
    </div>

    <!-- VIEW: DASHBOARD / FEED -->
    <div class="page-view hidden" id="dashboard-view">
        <div class="main-layout">
            <div id="feed-container" class="feed-container">
                <!-- Posts carregados aqui -->
            </div>
            <div class="load-more-sentinel" id="feed-sentinel"></div>
        </div>
    </div>

    <!-- VIEW: CRIAR POST -->
    <div class="page-view hidden" id="create-view">
        <div class="create-post-container">
            <div class="create-post-card">
                <h2>Novo Post</h2>
                <form id="form-create-post" class="create-post-form">
                  <div class="form-group">
    <input 
        id="post-title" 
        type="text" 
        placeholder="Título do post" 
        maxlength="100"
        required
    >
    <small id="title-count">0/100</small>
</div>
                    <div class="form-group">
                        <textarea 
                            id="post-caption" 
                            placeholder="O que está a pensar?" 
                            rows="4"
                            maxlength="500"
                            required
                        ></textarea>
                        <small id="char-count">0/500</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="post-image" class="btn-file">
                            <i class="fas fa-image"></i> Adicionar Imagem
                        </label>
                        <input 
                            id="post-image" 
                            type="file" 
                            accept="image/*"
                            style="display: none;"
                        >
                        <div id="image-preview" class="image-preview hidden"></div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="submit-post">Publicar</button>
                        <button type="button" class="btn-secondary" id="cancel-post">Cancelar</button>
                    </div>
                    
                    <div class="form-error" id="create-post-error"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- VIEW: PERFIL -->
    <div class="page-view hidden" id="profile-view">
        <div class="profile-layout-row">
            <!-- LADO ESQUERDO: Laranjas, Limões e Barra -->
            <div class="prof-col prof-left">
                <div class="rep-item">
                    <span>🍊</span>
                    <span id="stat-oranges">0</span>
                </div>
                <div class="rep-item">
                    <span>🍋</span>
                    <span id="stat-lemons">0</span>
                </div>
                <div class="status-box">
                    <div class="status-bar">
                        <div class="fill" id="behavior-bar" style="width: 50%;"></div>
                    </div>
                    <span class="status-txt" id="behavior-text">Neutro</span>
                </div>
            </div>

            <!-- CENTRO: Avatar, Username, Nome e Botão -->
            <div class="prof-col prof-center">
                <div class="pfp-main" id="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <span class="handle">@<span id="profile-handle">username</span></span>
                <h2 id="profile-name-display">Carregando...</h2>
                <button id="follow-btn" class="follow-btn">
                    <i class="fas fa-user-plus"></i> SEGUIR
                </button>
            </div>

            <!-- LADO DIREITO: Seguindo, Seguidores, Posts -->
            <div class="prof-col prof-right">
                <div class="stat-unit">
                    <span class="stat-label">Following</span>
                    <span class="stat-val" id="stat-following">0</span>
                </div>
                <div class="stat-unit">
                    <span class="stat-label">Followers</span>
                    <span class="stat-val" id="stat-followers">0</span>
                </div>
                <div class="stat-unit">
                    <span class="stat-label">Posts</span>
                    <span class="stat-val" id="stat-posts-count">0</span>
                </div>
            </div>
        </div>

        <div class="profile-actions">
            <button id="logout-btn" class="btn-danger">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>

        <div class="grid-sep">
            <i class="fas fa-th"></i>
            <span>Posts</span>
        </div>
        <div id="profile-feed-container" class="profile-grid"></div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
